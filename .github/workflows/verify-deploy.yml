name: Verify deployment

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Health endpoint
        run: |
          response=$(curl -sS -i -A "Mozilla/5.0" https://youtube-gemini-article.mixolydian-hour.workers.dev/api/health)
          echo "$response"
          echo "$response" | grep -q "HTTP/2 200"
      - name: Page contains the generator form
        run: |
          response=$(curl -sS -i -A "Mozilla/5.0" https://youtube-gemini-article.mixolydian-hour.workers.dev/)
          echo "$response"
          echo "$response" | grep -q 'id="generate-form"'
